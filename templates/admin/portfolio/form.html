{% extends "admin/base.html" %}
{% load static %}

{% block title %}{% if item %}Edit Project{% else %}Add Project{% endif %}{% endblock %}
{% block page_title %}{% if item %}Edit Project{% else %}Add Project{% endif %}{% endblock %}

{% block content %}
<div class="admin-form-card">
    <form method="post">
        {% csrf_token %}
        <div class="admin-form-grid">
            <div class="form-group">
                <label class="form-label" for="title">Title</label>
                <input type="text" id="title" name="title" class="form-control" value="{{ item.title|default:"" }}" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="slug">Slug</label>
                <input type="text" id="slug" name="slug" class="form-control" value="{{ item.slug|default:"" }}" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="client_name">Client Name</label>
                <input type="text" id="client_name" name="client_name" class="form-control" value="{{ item.client_name|default:"" }}">
            </div>
            <div class="form-group">
                <label class="form-label" for="industry">Industry</label>
                <input type="text" id="industry" name="industry" class="form-control" value="{{ item.industry|default:"" }}">
            </div>
            <div class="form-group">
                <label class="form-label" for="category">Category</label>
                <input type="text" id="category" name="category" class="form-control" value="{{ item.category|default:"" }}">
            </div>
            <div class="form-group">
                <label class="form-label" for="status">Status</label>
                <select id="status" name="status" class="form-control">
                    <option value="draft" {% if item.status == "draft" %}selected{% endif %}>Draft</option>
                    <option value="published" {% if item.status == "published" %}selected{% endif %}>Published</option>
                    <option value="archived" {% if item.status == "archived" %}selected{% endif %}>Archived</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="display_order">Display Order</label>
                <input type="number" id="display_order" name="display_order" class="form-control" value="{{ item.display_order|default:0 }}">
            </div>
            <div class="form-group">
                <label class="checkbox-group">
                    <input type="checkbox" name="featured" {% if item.featured %}checked{% endif %}>
                    <span>Featured</span>
                </label>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label" for="short_description">Short Description</label>
            <textarea id="short_description" name="short_description" class="form-control" rows="3">{{ item.short_description|default:"" }}</textarea>
        </div>
        <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <textarea id="description" name="description" class="form-control" rows="6">{{ item.description|default:"" }}</textarea>
        </div>
        <div class="form-group">
            <label class="form-label" for="challenge">Challenge</label>
            <textarea id="challenge" name="challenge" class="form-control" rows="4">{{ item.challenge|default:"" }}</textarea>
        </div>
        <div class="form-group">
            <label class="form-label" for="solution">Solution</label>
            <textarea id="solution" name="solution" class="form-control" rows="4">{{ item.solution|default:"" }}</textarea>
        </div>
        <div class="admin-form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'admin_portfolio_list' %}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
