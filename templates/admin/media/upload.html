{% extends "admin/base.html" %}
{% load static %}

{% block title %}Upload Media{% endblock %}
{% block page_title %}Upload Media{% endblock %}

{% block content %}
<div class="admin-form-card">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label" for="file">File</label>
            <input type="file" id="file" name="file" class="form-control" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="name">Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Media name">
        </div>
        <div class="form-group">
            <label class="form-label" for="category">Category</label>
            <select id="category" name="category" class="form-control">
                <option value="general">General</option>
                <option value="logos">Logos</option>
                <option value="services">Services</option>
                <option value="industries">Industries</option>
                <option value="portfolio">Portfolio</option>
                <option value="products">Products</option>
                <option value="testimonials">Testimonials</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label" for="alt_text">Alt Text</label>
            <input type="text" id="alt_text" name="alt_text" class="form-control" placeholder="Accessible description">
        </div>
        <div class="admin-form-actions">
            <button type="submit" class="btn btn-primary">Upload</button>
            <a href="{% url 'admin_media_list' %}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
