{% extends "base.html" %}
{% load static %}

{% block title %}Password Reset Complete — Orientiq{% endblock %}

{% block content %}
<section class="section auth-shell">
    <div class="container-narrow">
        <div class="card auth-card">
            <div class="auth-header">
                <span class="eyebrow">Reset Password</span>
                <h1>Password reset complete</h1>
                <p class="body-small text-muted">Your password has been set. You can now log in with your new password.</p>
            </div>
            <div class="auth-footer">
                <a href="{% url 'accounts_login' %}" class="btn btn-primary btn-lg">Log In</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
