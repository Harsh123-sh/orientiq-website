<a href="{% url 'product_detail' product.slug %}" class="card card-service card-interactive">
    <div class="card-icon">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            {% if product.icon == "travel" %}
            <circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            {% elif product.icon == "building" %}
            <rect x="4" y="2" width="16" height="20" rx="2"></rect><path d="M9 22v-4h6v4"></path><path d="M8 6h.01"></path><path d="M16 6h.01"></path><path d="M12 6h.01"></path><path d="M12 10h.01"></path><path d="M12 14h.01"></path><path d="M16 10h.01"></path><path d="M16 14h.01"></path><path d="M8 10h.01"></path><path d="M8 14h.01"></path>
            {% elif product.icon == "ai" %}
            <path d="M12 3a3 3 0 0 1 3 3 3 3 0 0 1 3 3 3 3 0 0 1 3 3"></path><path d="M12 3a3 3 0 0 0-3 3 3 3 0 0 0-3 3 3 3 0 0 0-3 3"></path><rect x="3" y="12" width="6" height="6" rx="1"></rect><rect x="15" y="12" width="6" height="6" rx="1"></rect>
            {% endif %}
        </svg>
    </div>
    <div class="flex-between mb-2">
        <h3>{{ product.name }}</h3>
        <span class="badge badge-info">{{ product.status_label }}</span>
    </div>
    <p class="caption text-muted mb-3">{{ product.category }}</p>
    <p>{{ product.description }}</p>
    <div class="flex gap-2 flex-wrap mt-4">
        {% for tech in product.technologies %}
        <span class="badge">{{ tech }}</span>
        {% endfor %}
    </div>
    <span class="link mt-4">{{ product.cta_label }} →</span>
</a>
