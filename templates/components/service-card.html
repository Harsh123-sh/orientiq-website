<a href="{% url 'service_detail' service.slug %}" class="card card-service card-interactive reveal-up reveal-stagger">
    <div class="card-icon">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            {% if service.icon == "ai" %}
            <path d="M12 3a3 3 0 0 1 3 3 3 3 0 0 1 3 3 3 3 0 0 1 3 3"></path><path d="M12 3a3 3 0 0 0-3 3 3 3 0 0 0-3 3 3 3 0 0 0-3 3"></path><rect x="3" y="12" width="6" height="6" rx="1"></rect><rect x="15" y="12" width="6" height="6" rx="1"></rect>
            {% elif service.icon == "web" %}
            <circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            {% elif service.icon == "mobile" %}
            <rect x="5" y="2" width="14" height="20" rx="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line>
            {% elif service.icon == "software" %}
            <polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline>
            {% elif service.icon == "design" %}
            <path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle>
            {% elif service.icon == "cloud" %}
            <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
            {% elif service.icon == "erp" %}
            <rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M7 7h4v4H7zM13 7h4v4h-4zM7 13h4v4H7zM13 13h4v4h-4z"></path>
            {% elif service.icon == "crm" %}
            <circle cx="9" cy="8" r="3"></circle><path d="M3 20a6 6 0 0 1 12 0M16 11a3 3 0 1 1 0 6M16 14h5"></path>
            {% endif %}
        </svg>
    </div>
    <h3>{{ service.name }}</h3>
    <p>{{ service.short }}</p>
    <span class="link mt-4">Learn more →</span>
</a>
