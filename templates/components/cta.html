<section class="section cta-section{% if variant %} cta-section--{{ variant }}{% endif %} reveal-up">
    <div class="container">
        <div class="card cta-card reveal-up">
            <div class="cta-content">
                        <span class="eyebrow">{{ eyebrow|default:"Start Today" }}</span>
                        <h2>{{ title }}</h2>
                        <p class="body-large text-muted">{{ subtitle }}</p>
                        <div class="flex gap-4 flex-wrap mt-6">
                            {% if primary_mailto %}
                            <a href="mailto:{{ primary_mailto }}" class="btn btn-primary btn-lg">{{ primary_label|default:"Email Us" }}</a>
                            {% else %}
                            <a href="{% url 'start_project' %}" class="btn btn-primary btn-lg">{{ primary_label|default:"Start a Project" }}</a>
                            {% endif %}
                            <a href="{% url 'company_contact' %}" class="btn btn-outline btn-lg">{{ secondary_label|default:"Contact Us" }}</a>
                        </div>
            </div>
            <div class="cta-visual" aria-hidden="true">
                <span class="cta-visual__glow"></span>
                <i class="cta-visual__orbit cta-visual__orbit--one"></i>
                <i class="cta-visual__orbit cta-visual__orbit--two"></i>
                <i class="cta-visual__orbit cta-visual__orbit--three"></i>
                <span class="cta-visual__node cta-visual__node--one"></span>
                <span class="cta-visual__node cta-visual__node--two"></span>
                <span class="cta-visual__emblem"><small>ORENTIQ</small><b>OQ</b></span>
            </div>
        </div>
    </div>
</section>
