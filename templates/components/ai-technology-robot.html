<div class="service-technology-core" aria-hidden="true">
    <svg class="service-technology-core__robot-art" viewBox="0 0 160 190" role="presentation">
        <defs>
            <linearGradient id="robot-shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf8"></stop><stop offset=".68" stop-color="#e9e2d7"></stop><stop offset="1" stop-color="#c8b9a8"></stop></linearGradient>
            <linearGradient id="robot-panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3937"></stop><stop offset="1" stop-color="#171716"></stop></linearGradient>
            <radialGradient id="robot-core" cx="50%" cy="35%"><stop offset="0" stop-color="#fff0d5"></stop><stop offset=".42" stop-color="#d58b4d"></stop><stop offset="1" stop-color="#8d4d27"></stop></radialGradient>
        </defs>
        <ellipse cx="80" cy="181" rx="47" ry="6" fill="#3c3028" opacity=".2"></ellipse>
        <path d="M49 42 42 50v42l10 11h56l10-11V50l-7-8Z" fill="url(#robot-shell)" stroke="#8e6b4d" stroke-width="2"></path>
        <path d="M53 57h54v24H53z" fill="url(#robot-panel)" stroke="#b97845" stroke-width="1.5"></path>
        <path d="M64 69h11m10 0h11" stroke="#f0b46f" stroke-width="4" stroke-linecap="round"></path>
        <path d="M77 48h6m-3-5V30" stroke="#6f5540" stroke-width="2" stroke-linecap="round"></path>
        <circle cx="80" cy="25" r="5" fill="#d7904f" stroke="#7e5535" stroke-width="2"></circle>
        <path d="M67 91h26l-4 8H71Z" fill="#494440" stroke="#8e6b4d" stroke-width="1.5"></path>
        <path d="M42 111 25 126v30h16l7-8v-25l12-8Z" fill="url(#robot-shell)" stroke="#8e6b4d" stroke-width="2"></path>
        <path d="m118 111 17 15v30h-16l-7-8v-25l-12-8Z" fill="url(#robot-shell)" stroke="#8e6b4d" stroke-width="2"></path>
        <path d="M48 105c10-6 54-6 64 0l16 18v43c-22 13-74 13-96 0v-43Z" fill="url(#robot-shell)" stroke="#8e6b4d" stroke-width="2"></path>
        <path d="M57 119h46v31H57z" fill="#242321" stroke="#a56f43" stroke-width="1.5"></path>
        <circle cx="80" cy="134" r="11" fill="url(#robot-core)" stroke="#e0a064" stroke-width="2"></circle>
        <path d="M80 126v16m-8-8h16" stroke="#ffe3b9" stroke-width="1.5" opacity=".85"></path>
        <path d="M65 159h30M53 169h54" stroke="#8e6b4d" stroke-width="2" stroke-linecap="round"></path>
        <path d="M65 170v7m30-7v7" stroke="#6f5540" stroke-width="4" stroke-linecap="round"></path>
    </svg>
    {% if core_label %}
    <strong>{{ core_label }}</strong>
    <small>TECHNOLOGY CORE</small>
    {% else %}
    <strong>AI &amp; AUTOMATION</strong>
    <small>INTELLIGENT CORE</small>
    {% endif %}
</div>
