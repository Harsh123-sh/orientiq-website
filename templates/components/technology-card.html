    <div class="card card-technology reveal-up reveal-stagger">
    <div class="card-icon">
        <svg class="icon tech-visual" viewBox="0 0 32 32" aria-hidden="true">
            {% if category == "Web & Application Development" %}
            <rect x="4" y="5" width="24" height="21" rx="3"></rect><path d="M4 11h24M9 8h.01M13 8h.01"></path><path class="tech-visual-detail" d="M9 17l3 3 5-6 3 3"></path>
            {% elif category == "AI & Machine Learning" %}
            <rect x="5" y="5" width="10" height="7" rx="2"></rect><rect x="17" y="20" width="10" height="7" rx="2"></rect><path class="tech-visual-detail" d="M15 8h3v15h-3M10 12v5h12v3"></path><circle cx="10" cy="23" r="2"></circle>
            {% elif category == "Data & Databases" %}
            <ellipse cx="16" cy="7" rx="10" ry="4"></ellipse><path class="tech-visual-detail" d="M6 7v8c0 2.2 4.5 4 10 4s10-1.8 10-4V7M6 15v6c0 2.2 4.5 4 10 4s10-1.8 10-4v-6"></path>
            {% elif category == "Cloud & Infrastructure" %}
            <circle cx="16" cy="16" r="4"></circle><circle cx="7" cy="9" r="2"></circle><circle cx="25" cy="9" r="2"></circle><circle cx="7" cy="24" r="2"></circle><circle cx="25" cy="24" r="2"></circle><path class="tech-visual-detail" d="M13 13L9 10M19 13l4-3M13 19l-4 4M19 19l4 4"></path>
            {% elif category == "DevOps" %}
            <circle cx="7" cy="16" r="3"></circle><circle cx="25" cy="8" r="3"></circle><circle cx="25" cy="24" r="3"></circle><path class="tech-visual-detail" d="M10 15l12-6M10 17l12 6"></path><path d="M15 16h4"></path>
            {% else %}
            <path d="M7 25V13l9-6 9 6v12"></path><path class="tech-visual-detail" d="M11 25v-7h10v7M16 7v-3M13 4h6"></path><circle cx="16" cy="14" r="2"></circle>
            {% endif %}
        </svg>
    </div>
    <h3>{{ category }}</h3>
    <div class="flex gap-2 flex-wrap justify-center mt-4">
        {% for item in items %}
        <span class="badge">{{ item }}</span>
        {% endfor %}
    </div>
</div>
