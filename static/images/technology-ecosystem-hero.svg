<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" fill="none">
  <defs>
    <radialGradient id="ambient" cx="50%" cy="48%" r="54%">
      <stop offset="0" stop-color="#e8b47d" stop-opacity=".2"/>
      <stop offset=".48" stop-color="#edc69d" stop-opacity=".1"/>
      <stop offset="1" stop-color="#faf7f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f4d3a8"/>
      <stop offset=".45" stop-color="#c7834e"/>
      <stop offset="1" stop-color="#8c4f2c"/>
    </linearGradient>
    <linearGradient id="copperSide" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d99d6a"/>
      <stop offset="1" stop-color="#77472e"/>
    </linearGradient>
    <linearGradient id="darkTop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38332e"/>
      <stop offset=".5" stop-color="#24211e"/>
      <stop offset="1" stop-color="#514338"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffaf3"/>
      <stop offset=".25" stop-color="#d9c7b3"/>
      <stop offset=".52" stop-color="#fff5e8"/>
      <stop offset=".78" stop-color="#b9a38d"/>
      <stop offset="1" stop-color="#f4e4d1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2=".9" y2="1">
      <stop stop-color="#fffefa" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#fffaf4" stop-opacity=".78"/>
      <stop offset="1" stop-color="#f1e4d6" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="iconTile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e9bf91"/>
      <stop offset="1" stop-color="#b77542"/>
    </linearGradient>
    <linearGradient id="edgeLight" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff9ef" stop-opacity=".94"/>
      <stop offset="1" stop-color="#dca36f" stop-opacity=".6"/>
    </linearGradient>
    <filter id="softShadow" x="-35%" y="-45%" width="170%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset dy="12" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="coreShadow" x="-35%" y="-40%" width="170%" height="190%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="23" result="blur"/>
      <feOffset dy="25" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".24"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="warmGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <filter id="nodeGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow" x="-30%" y="-50%" width="160%" height="210%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#5b4029" flood-opacity=".13"/>
    </filter>
  </defs>

