<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" fill="none">
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 244 -255 0 331 307)" gradientUnits="userSpaceOnUse"><stop stop-color="#ECC99D" stop-opacity=".31"/><stop offset="1" stop-color="#ECC99D" stop-opacity="0"/></radialGradient>
    <linearGradient id="bulb" x1="272" x2="378" y1="151" y2="296" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFDF7"/><stop offset=".55" stop-color="#F6D9A6"/><stop offset="1" stop-color="#C78A4D"/></linearGradient>
    <linearGradient id="rocket" x1="373" x2="438" y1="257" y2="397" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF8ED"/><stop offset="1" stop-color="#B77A45"/></linearGradient>
    <filter id="glowblur" x="198" y="103" width="238" height="294" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <style>
    .industry-aura { animation: industry-aura-breathe 9.5s ease-in-out infinite alternate; }
    .industry-orbit { transform-box: view-box; transform-origin: 331px 307px; animation: industry-orbit-turn 82s linear infinite; }
    .industry-particle { transform-box: fill-box; transform-origin: center; animation: industry-particle-drift 8s ease-in-out infinite; }
    .industry-particle:nth-of-type(2) { animation-delay: -2s; }.industry-particle:nth-of-type(3) { animation-delay: -4s; }.industry-particle:nth-of-type(4) { animation-delay: -6s; }
    .startup-bulb-glow { animation: startup-bulb-glow 9s ease-in-out infinite alternate; }
    .startup-bulb { transform-box: view-box; transform-origin: 321px 249px; animation: startup-bulb-breathe 9s ease-in-out infinite alternate; }
    .startup-rocket { transform-box: view-box; transform-origin: 414px 300px; animation: startup-rocket-drift 8.5s ease-in-out infinite; }
    .startup-growth { animation: startup-growth-breathe 9.5s ease-in-out infinite alternate; }
    .industry-card-glow { animation: industry-card-glow-breathe 8s ease-in-out infinite alternate; }
    .startup-card-a, .startup-icon-a { transform-box: fill-box; transform-origin: center; animation: industry-card-float 7s ease-in-out infinite; }
    .startup-card-b, .startup-icon-b { transform-box: fill-box; transform-origin: center; animation: industry-card-float 7.5s ease-in-out infinite; animation-delay: -2.4s; }
    .startup-card-c, .startup-icon-c { transform-box: fill-box; transform-origin: center; animation: industry-card-float 7.2s ease-in-out infinite; animation-delay: -4.3s; }
    @keyframes industry-aura-breathe { from { opacity: .88; } to { opacity: 1; } }
    @keyframes industry-orbit-turn { to { transform: rotate(360deg); } }
    @keyframes industry-particle-drift { 0%, 100% { opacity: .7; transform: translateY(0) scale(1); } 50% { opacity: .95; transform: translateY(-1.5px) scale(1.07); } }
    @keyframes industry-card-glow-breathe { from { opacity: .82; } to { opacity: 1; } }
    @keyframes industry-card-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    @keyframes startup-bulb-glow { from { opacity: .45; } to { opacity: .58; } }
    @keyframes startup-bulb-breathe { from { transform: scale(1); } to { transform: scale(1.004); } }
    @keyframes startup-rocket-drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-.8px, -1.2px); } }
    @keyframes startup-growth-breathe { from { opacity: .96; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <ellipse class="industry-aura" cx="331" cy="307" fill="url(#glow)" rx="246" ry="242"/>
  <g class="industry-orbit" stroke="#C98343" stroke-linecap="round" opacity=".46">
