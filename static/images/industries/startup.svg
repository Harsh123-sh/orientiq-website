    <path d="M143 211c48-82 127-128 216-128m99 355c-62 58-141 81-220 73"/>
    <circle class="industry-particle" cx="151" cy="200" r="3" fill="#C98343"/><circle class="industry-particle" cx="471" cy="165" r="3" fill="#C98343"/><circle class="industry-particle" cx="505" cy="380" r="2.5" fill="#C98343"/><circle class="industry-particle" cx="240" cy="478" r="2.5" fill="#C98343"/>
  </g>
  <ellipse cx="325" cy="470" fill="#6A472A" opacity=".17" rx="146" ry="21"/>
