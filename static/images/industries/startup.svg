    <circle cx="421" cy="270" r="10" fill="#FFF8ED" stroke="#A66B39" stroke-width="3"/><circle cx="421" cy="270" r="4" fill="#B67842"/>
    <path d="m396 339-14 29 24-17 18 2 16-18" stroke="#C4773A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="startup-growth">
    <path d="M209 436h226l-18 20H224l-15-20Z" fill="#6C5040" stroke="#C08B59" stroke-width="2"/>
    <path d="M226 425h172l20 11H209l17-11Z" fill="#F2E1CC" stroke="#AC805A" stroke-width="2"/>
    <path d="M249 414h120l29 11H226l23-11Z" fill="#A96A3B" stroke="#714628" stroke-width="2"/>
    <path d="M253 404h108l8 10H249l4-10Z" fill="#FFF6E9" stroke="#B88B62" stroke-width="1.5"/>
    <path d="m243 414 4-23 8 23m99 0 9-23 9 23" stroke="#B77B46" stroke-width="2"/>
    </g>
  </g>
  <g class="industry-cards industry-card-glow" fill="#FFFCF7" stroke="#D6A06A" stroke-width="1.4">
    <rect class="startup-card-a" x="143" y="296" width="56" height="54" rx="14"/><rect class="startup-card-b" x="464" y="195" width="57" height="55" rx="14"/><rect class="startup-card-c" x="455" y="386" width="56" height="54" rx="14"/>
  </g>
