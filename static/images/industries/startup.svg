    <g class="startup-icon-b"><path d="M477 231v-18h30v18m-22 0v-9h14v9"/></g>
    <g class="startup-icon-c"><path d="M467 426v-16h10v16m5 0v-23h10v23m5 0v-31h10v31"/></g>
