<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" fill="none">
  <defs>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="matrix(0 240 -250 0 332 306)" gradientUnits="userSpaceOnUse"><stop stop-color="#E7BE8D" stop-opacity=".28"/><stop offset="1" stop-color="#E7BE8D" stop-opacity="0"/></radialGradient>
    <linearGradient id="coat" x1="270" x2="418" y1="270" y2="464" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFCF7"/><stop offset="1" stop-color="#D9C8B3"/></linearGradient>
    <linearGradient id="skin" x1="318" x2="388" y1="129" y2="239" gradientUnits="userSpaceOnUse"><stop stop-color="#F5D2AD"/><stop offset="1" stop-color="#B9784B"/></linearGradient>
    <linearGradient id="metal" x1="335" x2="486" y1="322" y2="410" gradientUnits="userSpaceOnUse"><stop stop-color="#5F5146"/><stop offset="1" stop-color="#211E1B"/></linearGradient>
    <filter id="shadow" x="150" y="56" width="370" height="482" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="soft" x="0" y="0" width="640" height="620" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <style>
    .healthcare-aura { animation: healthcare-aura-breathe 10s ease-in-out infinite alternate; }
    .healthcare-orbit { transform-box: view-box; transform-origin: 331px 305px; animation: healthcare-orbit-turn 72s linear infinite; }
    .healthcare-particle { transform-box: fill-box; transform-origin: center; animation: healthcare-particle-drift 8s ease-in-out infinite; }
    .healthcare-particle:nth-of-type(2) { animation-delay: -2s; }
    .healthcare-particle:nth-of-type(3) { animation-delay: -4s; }
    .healthcare-particle:nth-of-type(4) { animation-delay: -6s; }
    .healthcare-doctor { transform-box: view-box; transform-origin: 365px 280px; animation: healthcare-doctor-float 7.5s ease-in-out infinite; }
    .healthcare-card-glow { animation: healthcare-card-glow-breathe 7s ease-in-out infinite alternate; }
    .healthcare-cards rect:nth-of-type(1), .healthcare-card-icons path:nth-of-type(1) { transform-box: fill-box; transform-origin: center; animation: healthcare-card-float 6.5s ease-in-out infinite; }
    .healthcare-cards rect:nth-of-type(2), .healthcare-card-icons path:nth-of-type(2) { transform-box: fill-box; transform-origin: center; animation: healthcare-card-float 7s ease-in-out infinite; animation-delay: -2.2s; }
    .healthcare-cards rect:nth-of-type(3), .healthcare-card-icons path:nth-of-type(3) { transform-box: fill-box; transform-origin: center; animation: healthcare-card-float 6.8s ease-in-out infinite; animation-delay: -4.1s; }
    @keyframes healthcare-aura-breathe { from { opacity: .88; } to { opacity: 1; } }
    @keyframes healthcare-orbit-turn { to { transform: rotate(360deg); } }
    @keyframes healthcare-particle-drift { 0%, 100% { opacity: .72; transform: translateY(0) scale(1); } 50% { opacity: 1; transform: translateY(-1.5px) scale(1.08); } }
    @keyframes healthcare-doctor-float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) rotate(.12deg) scale(1.003); } }
    @keyframes healthcare-card-glow-breathe { from { opacity: .8; } to { opacity: 1; } }
    @keyframes healthcare-card-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    @media (max-width: 820px) {
      @keyframes healthcare-particle-drift { 0%, 100% { opacity: .72; transform: translateY(0) scale(1); } 50% { opacity: .95; transform: translateY(-.75px) scale(1.05); } }
      @keyframes healthcare-doctor-float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-1.5px) rotate(.08deg) scale(1.002); } }
      @keyframes healthcare-card-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-.75px); } }
    }
    @media (prefers-reduced-motion: reduce) {
      .healthcare-aura, .healthcare-orbit, .healthcare-particle, .healthcare-doctor, .healthcare-card-glow,
      .healthcare-cards rect:nth-of-type(n), .healthcare-card-icons path:nth-of-type(n) { animation: none; }
    }
  </style>
  <ellipse class="healthcare-aura" cx="330" cy="307" fill="url(#aura)" rx="246" ry="242"/>
  <g class="healthcare-orbit" stroke="#C98343" stroke-linecap="round" opacity=".46">
    <ellipse cx="331" cy="305" rx="213" ry="177" transform="rotate(-25 331 305)" stroke-dasharray="2 7"/>
    <path d="M121 300c29-109 121-190 231-196M534 328c-22 83-84 145-165 170" stroke-width="1.2"/>
    <path d="M184 446c-62-57-87-137-65-211" opacity=".55"/>
    <circle class="healthcare-particle" cx="146" cy="239" r="3" fill="#C98343"/><circle class="healthcare-particle" cx="428" cy="113" r="3" fill="#C98343"/><circle class="healthcare-particle" cx="526" cy="386" r="3" fill="#C98343"/><circle class="healthcare-particle" cx="270" cy="485" r="2.5" fill="#C98343"/>
  </g>
  <ellipse cx="354" cy="469" fill="#754C2F" opacity=".18" rx="133" ry="21" filter="url(#soft)"/>
  <g filter="url(#shadow)" opacity=".2"><path fill="#6D5036" d="M271 239h161v211H271z"/></g>
  <g class="healthcare-doctor">
    <path d="M302 206c7-31 18-62 40-76 22-14 51-8 67 11 13 15 15 34 10 58l-12 47-97-10-8-30Z" fill="#30271F"/>
    <path d="M321 151c20-24 58-20 75 4 12 18 12 48 3 68-10 24-28 37-48 33-23-4-38-28-41-54-2-19 1-38 11-51Z" fill="url(#skin)"/>
    <path d="M316 173c2-30 20-49 47-48 18 1 36 14 41 31-23-12-49-12-72 1l-12 37-4-21Z" fill="#30271F"/>
    <path d="M341 241h48l8 36-40 20-29-23 13-33Z" fill="url(#skin)"/>
    <path d="M292 270c20-17 37-23 59-23l33 23 27-17c20 9 35 23 46 43l25 133H249l20-116c4-18 11-32 23-43Z" fill="url(#coat)" stroke="#B89D7E" stroke-width="2"/>
    <path d="m348 250 19 47-27 28-15-45 23-30Zm37-2-18 49 30 28 12-56-24-21Z" fill="#F8F0E5" stroke="#B89D7E" stroke-width="1.5"/>
    <path d="M365 298v92" stroke="#AA896A" stroke-width="2"/>
    <path d="M303 304c-16 25-29 53-33 81-2 15 8 26 22 25 12-1 18-11 21-25l18-61m71-24c16 23 28 46 35 72 4 15-4 28-17 29-13 1-21-8-25-22l-17-48" fill="url(#skin)" stroke="#B9784B" stroke-width="3" stroke-linecap="round"/>
    <path d="M284 390c14 1 25-5 30-15m105 6c-13 6-24 4-32-5" stroke="#8A593B" stroke-width="2" stroke-linecap="round"/>
    <path d="M333 326c17 13 35 13 52 0" stroke="#C98B53" stroke-width="2"/>
    <circle cx="389" cy="332" r="4" fill="#B87943"/><path d="M389 336c-5 26 4 39 18 45" stroke="#B87943" stroke-width="2"/>
    <g transform="rotate(-10 405 355)">
      <rect x="358" y="326" width="108" height="69" rx="10" fill="url(#metal)" stroke="#BB8250" stroke-width="2"/>
      <rect x="365" y="333" width="94" height="55" rx="6" fill="#F7F1E8"/>
      <path d="M376 367h18l7-16 10 24 9-15h28" stroke="#C77C3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="376" cy="345" r="2" fill="#D8B58E"/><circle cx="447" cy="345" r="2" fill="#D8B58E"/>
    </g>
  </g>
  <g class="healthcare-card-glow" fill="#FFFCF7" stroke="#D9A46F" stroke-opacity=".68" filter="url(#soft)"><circle cx="184" cy="186" r="31"/><circle cx="495" cy="218" r="30"/><circle cx="205" cy="386" r="27"/></g>
  <g class="healthcare-cards" fill="#FFFCF7" stroke="#D6A06A" stroke-width="1.4">
    <rect x="151" y="156" width="59" height="57" rx="14"/><rect x="467" y="188" width="58" height="57" rx="14"/><rect x="176" y="360" width="56" height="53" rx="13"/>
  </g>
  <g class="healthcare-card-icons" stroke="#A96735" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 184h19m-9-9v19"/><path d="M496 207v18m-9-9h18"/><path d="M190 391h7l5-11 7 21 6-13h6"/>
  </g>
</svg>