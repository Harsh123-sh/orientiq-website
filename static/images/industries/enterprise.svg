<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" fill="none">
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 240 -255 0 331 307)" gradientUnits="userSpaceOnUse"><stop stop-color="#EAC596" stop-opacity=".3"/><stop offset="1" stop-color="#EAC596" stop-opacity="0"/></radialGradient>
    <linearGradient id="tower" x1="243" x2="314" y1="179" y2="421" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF8ED"/><stop offset="1" stop-color="#BBA58D"/></linearGradient>
    <linearGradient id="towerDark" x1="324" x2="401" y1="204" y2="428" gradientUnits="userSpaceOnUse"><stop stop-color="#DBC8B0"/><stop offset="1" stop-color="#766050"/></linearGradient>
    <filter id="shadow" x="140" y="144" width="364" height="366" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="17"/></filter>
  </defs>
  <style>
    .industry-aura { animation: industry-aura-breathe 12s ease-in-out infinite alternate; }
    .industry-orbit { transform-box: view-box; transform-origin: 331px 307px; animation: industry-orbit-turn 100s linear infinite; }
    .industry-particle { transform-box: fill-box; transform-origin: center; animation: industry-particle-drift 9s ease-in-out infinite; }
    .industry-particle:nth-of-type(2) { animation-delay: -2.2s; }.industry-particle:nth-of-type(3) { animation-delay: -4.4s; }.industry-particle:nth-of-type(4) { animation-delay: -6.6s; }
    .enterprise-buildings { transform-box: view-box; animation: enterprise-building-breathe 10s ease-in-out infinite; }
    .enterprise-cloud { animation: enterprise-cloud-drift 11s ease-in-out infinite alternate; }
    .industry-card-glow { animation: industry-card-glow-breathe 9s ease-in-out infinite alternate; }
    .enterprise-card-a, .enterprise-icon-a { transform-box: fill-box; transform-origin: center; animation: industry-card-float 8.5s ease-in-out infinite; }
    .enterprise-card-b, .enterprise-icon-b { transform-box: fill-box; transform-origin: center; animation: industry-card-float 9s ease-in-out infinite; animation-delay: -3s; }
    .enterprise-card-c, .enterprise-icon-c { transform-box: fill-box; transform-origin: center; animation: industry-card-float 8.8s ease-in-out infinite; animation-delay: -5.5s; }
    @keyframes industry-aura-breathe { from { opacity: .9; } to { opacity: 1; } }
    @keyframes industry-orbit-turn { to { transform: rotate(360deg); } }
    @keyframes industry-particle-drift { 0%, 100% { opacity: .62; transform: translateY(0) scale(1); } 50% { opacity: .82; transform: translateY(-.8px) scale(1.04); } }
    @keyframes industry-card-glow-breathe { from { opacity: .86; } to { opacity: 1; } }
    @keyframes industry-card-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-.8px); } }
    @keyframes enterprise-building-breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-.8px); } }
    @keyframes enterprise-cloud-drift { from { opacity: .94; transform: translateY(0); } to { opacity: 1; transform: translateY(-.6px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <ellipse class="industry-aura" cx="331" cy="307" fill="url(#glow)" rx="246" ry="242"/>
