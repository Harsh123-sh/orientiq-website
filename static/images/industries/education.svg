    <path d="m183 304 116-34 155 35-132 40-139-41Z" fill="url(#cover)" stroke="#714322" stroke-width="2"/>
    <path d="m193 294 106-31 135 31-113 35-128-35Z" fill="url(#pages)" stroke="#B89B79" stroke-width="2"/>
    <path d="m208 285 90-25 114 26-95 29-109-30Z" fill="#FFFDF8" stroke="#D9C5A9" stroke-width="1.5"/>
