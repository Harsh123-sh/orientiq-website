<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" fill="none">
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 245 -255 0 331 315)" gradientUnits="userSpaceOnUse"><stop stop-color="#E8C395" stop-opacity=".3"/><stop offset="1" stop-color="#E8C395" stop-opacity="0"/></radialGradient>
    <linearGradient id="pages" x1="195" x2="440" y1="329" y2="401" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFDF8"/><stop offset="1" stop-color="#E9D8C2"/></linearGradient>
    <linearGradient id="cover" x1="192" x2="452" y1="383" y2="446" gradientUnits="userSpaceOnUse"><stop stop-color="#A45E32"/><stop offset="1" stop-color="#57351F"/></linearGradient>
    <linearGradient id="gold" x1="267" x2="406" y1="195" y2="274" gradientUnits="userSpaceOnUse"><stop stop-color="#F5D7A8"/><stop offset="1" stop-color="#A96A36"/></linearGradient>
    <filter id="shadow" x="138" y="92" width="370" height="425" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <style>
    .industry-aura { animation: industry-aura-breathe 10s ease-in-out infinite alternate; }
    .industry-orbit { transform-box: view-box; transform-origin: 331px 307px; animation: industry-orbit-turn 90s linear infinite; }
    .industry-particle { transform-box: fill-box; transform-origin: center; animation: industry-particle-drift 8.5s ease-in-out infinite; }
    .industry-particle:nth-of-type(2) { animation-delay: -2s; }.industry-particle:nth-of-type(3) { animation-delay: -4s; }.industry-particle:nth-of-type(4) { animation-delay: -6s; }
    .education-books { animation: education-books-breathe 8.5s ease-in-out infinite; }
    .education-cap { transform-box: view-box; transform-origin: 326px 250px; animation: education-cap-float 9s ease-in-out infinite; }
    .industry-card-glow { animation: industry-card-glow-breathe 8s ease-in-out infinite alternate; }
    .education-card-a, .education-icon-a { transform-box: fill-box; transform-origin: center; animation: industry-card-float 7s ease-in-out infinite; }
    .education-card-b, .education-icon-b { transform-box: fill-box; transform-origin: center; animation: industry-card-float 7.5s ease-in-out infinite; animation-delay: -2.4s; }
    .education-card-c, .education-icon-c { transform-box: fill-box; transform-origin: center; animation: industry-card-float 7.2s ease-in-out infinite; animation-delay: -4.3s; }
    @keyframes industry-aura-breathe { from { opacity: .88; } to { opacity: 1; } }
    @keyframes industry-orbit-turn { to { transform: rotate(360deg); } }
    @keyframes industry-particle-drift { 0%, 100% { opacity: .7; transform: translateY(0) scale(1); } 50% { opacity: .95; transform: translateY(-1.25px) scale(1.06); } }
    @keyframes industry-card-glow-breathe { from { opacity: .82; } to { opacity: 1; } }
    @keyframes industry-card-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.25px); } }
    @keyframes education-books-breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.25px); } }
    @keyframes education-cap-float { 0%, 100% { transform: translate(0, 0) rotate(0); } 50% { transform: translateY(-.8px) rotate(.12deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <ellipse class="industry-aura" cx="331" cy="307" fill="url(#glow)" rx="245" ry="242"/>
  <g class="industry-orbit" stroke="#C98343" stroke-linecap="round" opacity=".45">
