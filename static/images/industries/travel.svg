<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" fill="none">
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 238 -253 0 331 307)" gradientUnits="userSpaceOnUse"><stop stop-color="#EAC597" stop-opacity=".3"/><stop offset="1" stop-color="#EAC597" stop-opacity="0"/></radialGradient>
    <radialGradient id="earth" cx="0" cy="0" r="1" gradientTransform="matrix(125 145 -141 122 279 203)" gradientUnits="userSpaceOnUse"><stop stop-color="#F2D8B5"/><stop offset=".55" stop-color="#B98351"/><stop offset="1" stop-color="#67452D"/></radialGradient>
    <linearGradient id="case" x1="373" x2="463" y1="325" y2="446" gradientUnits="userSpaceOnUse"><stop stop-color="#8D5A37"/><stop offset="1" stop-color="#3F3028"/></linearGradient>
    <filter id="shadow" x="126" y="110" width="403" height="391" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <style>
    .industry-aura { animation: industry-aura-breathe 10s ease-in-out infinite alternate; }
    .industry-orbit { transform-box: view-box; transform-origin: 331px 307px; animation: industry-orbit-turn 76s linear infinite; }
    .industry-particle { transform-box: fill-box; transform-origin: center; animation: industry-particle-drift 8s ease-in-out infinite; }
    .industry-particle:nth-of-type(2) { animation-delay: -2s; }.industry-particle:nth-of-type(3) { animation-delay: -4s; }.industry-particle:nth-of-type(4) { animation-delay: -6s; }
    .travel-globe { transform-box: fill-box; transform-origin: center; animation: travel-globe-breathe 13s ease-in-out infinite alternate; }
    .travel-plane-motion { transform-box: view-box; transform-origin: 312px 147px; animation: travel-plane-drift 9s ease-in-out infinite; }
    .travel-case { animation: travel-case-float 8s ease-in-out infinite; }
    .industry-card-glow { animation: industry-card-glow-breathe 8s ease-in-out infinite alternate; }
    .travel-card-a, .travel-icon-a { transform-box: fill-box; transform-origin: center; animation: industry-card-float 7s ease-in-out infinite; }
    .travel-card-b, .travel-icon-b { transform-box: fill-box; transform-origin: center; animation: industry-card-float 7.5s ease-in-out infinite; animation-delay: -2.4s; }
    .travel-card-c, .travel-icon-c { transform-box: fill-box; transform-origin: center; animation: industry-card-float 7.2s ease-in-out infinite; animation-delay: -4.3s; }
    @keyframes industry-aura-breathe { from { opacity: .88; } to { opacity: 1; } }
    @keyframes industry-orbit-turn { to { transform: rotate(360deg); } }
    @keyframes industry-particle-drift { 0%, 100% { opacity: .7; transform: translateY(0) scale(1); } 50% { opacity: .95; transform: translateY(-1.5px) scale(1.07); } }
    @keyframes industry-card-glow-breathe { from { opacity: .82; } to { opacity: 1; } }
    @keyframes industry-card-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    @keyframes travel-globe-breathe { from { transform: scale(1); } to { transform: scale(1.006); } }
    @keyframes travel-plane-drift { 0%, 100% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(1px, -1.5px) rotate(.18deg); } }
    @keyframes travel-case-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <ellipse class="industry-aura" cx="331" cy="307" fill="url(#glow)" rx="246" ry="240"/>
  <g class="industry-orbit" stroke="#C98343" stroke-linecap="round" opacity=".46">
