    <ellipse cx="300" cy="294" stroke="#F7E4CA" stroke-opacity=".42" stroke-width="1.4" rx="53" ry="119"/>
    <path d="M228 406c64 22 144 18 202-11l-20 29c-57 29-126 33-186 11l4-29Z" fill="#F3E3CF" stroke="#A8754B" stroke-width="2"/>
    <path d="m305 424 18 2 8 15-17 11-17-10 8-18Z" fill="#A86D3D"/><circle cx="314" cy="432" r="4" fill="#F3D3A3"/>
    </g>
    <g class="travel-plane-motion">
    <g transform="rotate(-17 312 147)">
      <path d="m277 149 43-11 19-46c4-9 14-8 15 2l-3 47 42 19c9 4 7 14-2 15l-45-7-29 38c-6 8-15 4-13-5l12-42-39-8c-8-2-8-11 0-13Z" fill="#FFF9EF" stroke="#9F6235" stroke-width="2"/>
      <path d="m320 138 13 3-10 31-13-3 10-31Z" fill="#C27C43"/>
    </g>
    </g>
    <g class="travel-case">
      <path d="M376 327h84l12 112h-98l2-112Z" fill="url(#case)" stroke="#D5A26E" stroke-width="2.5"/>
      <path d="M395 328v-15c0-16 9-25 24-25s24 9 24 25v15" stroke="#765034" stroke-width="8"/>
      <path d="M395 329v-16c0-12 8-19 24-19 15 0 23 7 23 19v16" stroke="#D1A06C" stroke-width="3"/>
      <path d="M411 353h14v31h-14z" fill="#D8B888"/><path d="M418 357v23" stroke="#8A5A35" stroke-width="2"/>
      <path d="M383 410h78" stroke="#DDAA70" stroke-width="2" opacity=".6"/>
    </g>
    <path d="M222 435h70l-8 16h-54l-8-16Z" fill="#FFF9EF" stroke="#B98454" stroke-width="2"/><path d="M233 435v-31h43v31" stroke="#B98454" stroke-width="2"/>
  </g>
  <g class="industry-cards industry-card-glow" fill="#FFFCF7" stroke="#D6A06A" stroke-width="1.4">
    <rect class="travel-card-a" x="139" y="304" width="56" height="54" rx="14"/><rect class="travel-card-b" x="475" y="229" width="58" height="56" rx="14"/><rect class="travel-card-c" x="464" y="385" width="56" height="54" rx="14"/>
  </g>
  <g class="industry-icons" stroke="#A96735" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <g class="travel-icon-a"><path d="M156 319h23v22h-23zM161 325h13m-13 6h9"/></g><g class="travel-icon-b"><path d="m487 257 8-10 8 10v14h-16v-14Z"/><circle cx="495" cy="256" r="2" fill="#A96735"/></g><g class="travel-icon-c"><path d="M478 405c5-7 11-8 17-2 5-6 11-5 16 2v17h-33v-17Z"/></g>
  </g>
</svg>