    <path d="M153 211c45-77 118-122 202-126m96 351c-56 60-133 88-211 82"/>
    <circle class="industry-particle" cx="156" cy="208" r="3" fill="#C98343"/><circle class="industry-particle" cx="452" cy="151" r="3" fill="#C98343"/><circle class="industry-particle" cx="511" cy="370" r="2.5" fill="#C98343"/><circle class="industry-particle" cx="233" cy="472" r="2.5" fill="#C98343"/>
  </g>
  <ellipse cx="327" cy="470" fill="#6A472A" opacity=".18" rx="150" ry="22" filter="url(#shadow)"/>
