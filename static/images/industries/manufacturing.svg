<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" fill="none">
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 239 -254 0 331 307)" gradientUnits="userSpaceOnUse"><stop stop-color="#E7C092" stop-opacity=".3"/><stop offset="1" stop-color="#E7C092" stop-opacity="0"/></radialGradient>
    <linearGradient id="arm" x1="252" x2="404" y1="204" y2="345" gradientUnits="userSpaceOnUse"><stop stop-color="#F9E6C9"/><stop offset=".52" stop-color="#C18347"/><stop offset="1" stop-color="#80512F"/></linearGradient>
    <linearGradient id="platform" x1="180" x2="472" y1="395" y2="469" gradientUnits="userSpaceOnUse"><stop stop-color="#F9F1E6"/><stop offset="1" stop-color="#B4A08A"/></linearGradient>
    <filter id="shadow" x="138" y="137" width="374" height="377" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="17"/></filter>
  </defs>
  <style>
    .industry-aura { animation: industry-aura-breathe 11s ease-in-out infinite alternate; }
    .industry-orbit { transform-box: view-box; transform-origin: 331px 307px; animation: industry-orbit-turn 86s linear infinite; }
    .industry-particle { transform-box: fill-box; transform-origin: center; animation: industry-particle-drift 8.5s ease-in-out infinite; }
    .industry-particle:nth-of-type(2) { animation-delay: -2s; }.industry-particle:nth-of-type(3) { animation-delay: -4s; }.industry-particle:nth-of-type(4) { animation-delay: -6s; }
    .manufacturing-arm { transform-box: view-box; transform-origin: 283px 228px; animation: manufacturing-arm-adjust 9.5s ease-in-out infinite; }
    .manufacturing-platform { animation: manufacturing-line-breathe 9s ease-in-out infinite alternate; }
    .industry-card-glow { animation: industry-card-glow-breathe 8s ease-in-out infinite alternate; }
    .manufacturing-card-a, .manufacturing-icon-a { transform-box: fill-box; transform-origin: center; animation: industry-card-float 7s ease-in-out infinite; }
    .manufacturing-card-b, .manufacturing-icon-b { transform-box: fill-box; transform-origin: center; animation: industry-card-float 7.5s ease-in-out infinite; animation-delay: -2.4s; }
    .manufacturing-card-c, .manufacturing-icon-c { transform-box: fill-box; transform-origin: center; animation: industry-card-float 7.2s ease-in-out infinite; animation-delay: -4.3s; }
    @keyframes industry-aura-breathe { from { opacity: .88; } to { opacity: 1; } }
    @keyframes industry-orbit-turn { to { transform: rotate(360deg); } }
    @keyframes industry-particle-drift { 0%, 100% { opacity: .7; transform: translateY(0) scale(1); } 50% { opacity: .95; transform: translateY(-1px) scale(1.06); } }
    @keyframes industry-card-glow-breathe { from { opacity: .82; } to { opacity: 1; } }
    @keyframes industry-card-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.25px); } }
    @keyframes manufacturing-arm-adjust { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(.2deg); } }
    @keyframes manufacturing-line-breathe { from { opacity: .96; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <ellipse class="industry-aura" cx="331" cy="307" fill="url(#glow)" rx="246" ry="241"/>
